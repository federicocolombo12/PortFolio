<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1140 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-arch-title pipeline-arch-desc" id="pipeline_architecture_diagram-root">
      <title id="pipeline-arch-title">Blender 5.3 Stylized 3D Gaussian Splats Pipeline Architecture</title>
      <desc id="pipeline-arch-desc">Technical architecture diagram illustrating the end-to-end flow from raw 3DGS capture, OpenUSD conversion, Blender 5.3 native PointCloud primitives, Geometry Nodes tangent flow and covariance deformation, to EEVEE-Next real-time viewport compositing at 60 FPS.</desc>
      
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #pipeline_architecture_diagram-root { --color-paper:        #0e1422;
      --color-paper-node:   #151d30;
      --color-ink:          #f8fafc;
      --color-muted:        #94a3b8;
      --color-soft:         #64748b;
      --color-accent:       #f08a59;
      --color-accent-tint:  rgba(240, 138, 89, 0.10);
      --color-cyan:         #00e5ff;
      --color-cyan-tint:    rgba(0, 229, 255, 0.08);
      --font-sans:          'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:         'Instrument Serif', Georgia, serif;
      --font-mono:          'Geist Mono', ui-monospace, monospace; }
      #pipeline_architecture_diagram-root { font-family: var(--font-sans); color: var(--color-ink); }</style>
        <pattern id="pipeline_architecture_diagram-arch-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#f8fafc" fill-opacity="0.08"/>
        </pattern>
        <marker id="pipeline_architecture_diagram-arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
        </marker>
        <marker id="pipeline_architecture_diagram-arch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#f08a59"/>
        </marker>
        <marker id="pipeline_architecture_diagram-arch-arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#00e5ff"/>
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="100%" height="100%" rx="8" fill="#0e1422"/>
      <rect width="100%" height="100%" rx="8" fill="url(#pipeline_architecture_diagram-arch-dots)" opacity="0.6"/>

      <!-- ========================================== -->
      <!-- ZONES / STAGES (drawn before arrows & nodes)-->
      <!-- ========================================== -->

      <!-- Zone 1: Asset Ingestion & Conversion -->
      <rect x="36" y="44" width="332" height="260" rx="8"
            fill="#f8fafc" fill-opacity="0.02" stroke="#f8fafc" stroke-opacity="0.12" stroke-width="0.8"/>
      <rect x="52" y="48" width="168" height="14" rx="2" fill="#0e1422"/>
      <text x="136" y="58" fill="#94a3b8" font-size="7.5" font-family="'Geist Mono', monospace"
            font-weight="500" text-anchor="middle" letter-spacing="0.14em">STAGE 01 · ASSET INGESTION</text>

      <!-- Zone 2: Blender 5.3 Core & Geometry Nodes -->
      <rect x="396" y="44" width="348" height="260" rx="8"
            fill="#00e5ff" fill-opacity="0.02" stroke="#00e5ff" stroke-opacity="0.22" stroke-width="0.8"/>
      <rect x="412" y="48" width="188" height="14" rx="2" fill="#0e1422"/>
      <text x="506" y="58" fill="#00e5ff" font-size="7.5" font-family="'Geist Mono', monospace"
            font-weight="500" text-anchor="middle" letter-spacing="0.14em">STAGE 02 · BLENDER GPU CORE</text>

      <!-- Zone 3: EEVEE-Next Viewport Compositor -->
      <rect x="772" y="44" width="332" height="260" rx="8"
            fill="#f08a59" fill-opacity="0.02" stroke="#f08a59" stroke-opacity="0.22" stroke-width="0.8"/>
      <rect x="788" y="48" width="180" height="14" rx="2" fill="#0e1422"/>
      <text x="878" y="58" fill="#f08a59" font-size="7.5" font-family="'Geist Mono', monospace"
            font-weight="500" text-anchor="middle" letter-spacing="0.14em">STAGE 03 · VIEWPORT COMPOSITOR</text>

      <!-- ========================================== -->
      <!-- CONNECTORS / DATA FLOW ARROWS             -->
      <!-- ========================================== -->

      <!-- Arrow 1 -> 2 (Node 1 to Node 2) -->
      <line x1="192" y1="182" x2="216" y2="182" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#pipeline_architecture_diagram-arch-arrow)"/>

      <!-- Arrow 2 -> 3 (Stage 1 to Stage 2: USD export/import) -->
      <line x1="352" y1="182" x2="412" y2="182" stroke="#00e5ff" stroke-width="1.4" marker-end="url(#pipeline_architecture_diagram-arch-arrow-cyan)"/>
      <rect x="362" y="162" width="40" height="13" rx="2" fill="#0e1422" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="0.7"/>
      <text x="382" y="171" fill="#00e5ff" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">.USDC</text>

      <!-- Arrow 3 -> 4 (Node 3 to Focal Node 4: Direct GPU Binding) -->
      <line x1="556" y1="182" x2="580" y2="182" stroke="#f08a59" stroke-width="1.4" marker-end="url(#pipeline_architecture_diagram-arch-arrow-accent)"/>

      <!-- Arrow 4 -> 5 (Stage 2 to Stage 3: Evaluated Geometry to EEVEE-Next) -->
      <line x1="728" y1="182" x2="788" y2="182" stroke="#f08a59" stroke-width="1.4" marker-end="url(#pipeline_architecture_diagram-arch-arrow-accent)"/>
      <rect x="736" y="162" width="44" height="13" rx="2" fill="#0e1422" stroke="#f08a59" stroke-opacity="0.3" stroke-width="0.7"/>
      <text x="758" y="171" fill="#f08a59" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SHADING</text>

      <!-- Arrow 5 -> 6 (Node 5 to Node 6: Compositor to Display) -->
      <line x1="932" y1="182" x2="956" y2="182" stroke="#00e5ff" stroke-width="1.4" marker-end="url(#pipeline_architecture_diagram-arch-arrow-cyan)"/>

      <!-- ========================================== -->
      <!-- NODES                                      -->
      <!-- ========================================== -->

      <!-- Node 1: Raw 3DGS Capture -->
      <g>
        <rect x="52" y="84" width="140" height="196" rx="6" fill="#151d30"/>
        <rect x="52" y="84" width="140" height="196" rx="6" fill="#f8fafc" fill-opacity="0.02" stroke="#f8fafc" stroke-opacity="0.20" stroke-width="1"/>
        <rect x="62" y="96" width="38" height="14" rx="2" fill="none" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="81" y="106" fill="#94a3b8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
        <text x="182" y="264" fill="#f8fafc" fill-opacity="0.06" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
        <text x="62" y="132" fill="#f8fafc" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Raw 3DGS</text>
        <text x="62" y="148" fill="#94a3b8" font-size="8.5" font-family="'Geist Mono', monospace">Radiance Fields</text>
        <line x1="62" y1="160" x2="182" y2="160" stroke="#f8fafc" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="62" y="178" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• .ply / .splat capture</text>
        <text x="62" y="196" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• 3D covariance scale</text>
        <text x="62" y="214" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• Spherical harmonics</text>
        <text x="62" y="232" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• Opacity scalar fields</text>
        <text x="62" y="250" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace">High-freq needle cloud</text>
      </g>

      <!-- Node 2: OpenUSD Converter -->
      <g>
        <rect x="216" y="84" width="136" height="196" rx="6" fill="#151d30"/>
        <rect x="216" y="84" width="136" height="196" rx="6" fill="#00e5ff" fill-opacity="0.03" stroke="#00e5ff" stroke-opacity="0.30" stroke-width="1"/>
        <rect x="226" y="96" width="58" height="14" rx="2" fill="none" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="255" y="106" fill="#00e5ff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOLCHAIN</text>
        <text x="342" y="264" fill="#00e5ff" fill-opacity="0.06" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">02</text>
        <text x="226" y="132" fill="#f8fafc" font-size="12" font-weight="600" font-family="'Geist', sans-serif">USD Converter</text>
        <text x="226" y="148" fill="#94a3b8" font-size="8.5" font-family="'Geist Mono', monospace">usdcat / Python</text>
        <line x1="226" y1="160" x2="342" y2="160" stroke="#f8fafc" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="226" y="178" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• Ingests raw splats</text>
        <text x="226" y="196" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• ParticleField schema</text>
        <text x="226" y="214" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• Normalized colors</text>
        <text x="226" y="232" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• Packaged attributes</text>
        <text x="226" y="250" fill="#00e5ff" font-size="7.5" font-family="'Geist Mono', monospace">Binary .usdc export</text>
      </g>

      <!-- Node 3: Blender 5.3 Native PointCloud -->
      <g>
        <rect x="412" y="84" width="144" height="196" rx="6" fill="#151d30"/>
        <rect x="412" y="84" width="144" height="196" rx="6" fill="#00e5ff" fill-opacity="0.04" stroke="#00e5ff" stroke-width="1"/>
        <rect x="422" y="96" width="62" height="14" rx="2" fill="none" stroke="#00e5ff" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="453" y="106" fill="#00e5ff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BLENDER 5.3</text>
        <text x="546" y="264" fill="#00e5ff" fill-opacity="0.08" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">03</text>
        <text x="422" y="132" fill="#f8fafc" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Native PointCloud</text>
        <text x="422" y="148" fill="#00e5ff" font-size="8.5" font-family="'Geist Mono', monospace">Zero-Copy GPU Buffer</text>
        <line x1="422" y1="160" x2="546" y2="160" stroke="#f8fafc" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="422" y="178" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• 5.3 Beta PointCloud</text>
        <text x="422" y="196" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• Zero CPU mesh clone</text>
        <text x="422" y="214" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• Direct VRAM residency</text>
        <text x="422" y="232" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• Attribute field maps</text>
        <text x="422" y="250" fill="#94a3b8" font-size="7.5" font-family="'Geist Mono', monospace">Scale / Rot / Radiance</text>
      </g>

      <!-- Node 4: StylizedSplatModifier (FOCAL ACCENT NODE) -->
      <g>
        <rect x="580" y="84" width="148" height="196" rx="6" fill="#151d30"/>
        <rect x="580" y="84" width="148" height="196" rx="6" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1.4"/>
        <rect x="590" y="96" width="76" height="14" rx="2" fill="none" stroke="#f08a59" stroke-opacity="0.6" stroke-width="0.8"/>
        <text x="628" y="106" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FOCAL · GEONODES</text>
        <text x="718" y="264" fill="#f08a59" fill-opacity="0.12" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">04</text>
        <text x="590" y="132" fill="#f8fafc" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Stylized Modifier</text>
        <text x="590" y="148" fill="#f08a59" font-size="8.5" font-family="'Geist Mono', monospace">Vector Field Pipeline</text>
        <line x1="590" y1="160" x2="718" y2="160" stroke="#f08a59" stroke-opacity="0.25" stroke-width="0.8"/>
        <text x="590" y="178" fill="#f8fafc" font-size="8" font-family="'Geist', sans-serif">• Tangent flow vectors</text>
        <text x="590" y="196" fill="#f8fafc" font-size="8" font-family="'Geist', sans-serif">• Anisotropic scale (8x)</text>
        <text x="590" y="214" fill="#f8fafc" font-size="8" font-family="'Geist', sans-serif">• Curl noise offset field</text>
        <text x="590" y="232" fill="#f8fafc" font-size="8" font-family="'Geist', sans-serif">• Albedo delighting pass</text>
        <text x="590" y="250" fill="#f08a59" font-size="7.5" font-family="'Geist Mono', monospace">Stochastic decimation</text>
      </g>

      <!-- Node 5: EEVEE-Next Compositor -->
      <g>
        <rect x="788" y="84" width="144" height="196" rx="6" fill="#151d30"/>
        <rect x="788" y="84" width="144" height="196" rx="6" fill="#f08a59" fill-opacity="0.04" stroke="#f08a59" stroke-opacity="0.4" stroke-width="1"/>
        <rect x="798" y="96" width="68" height="14" rx="2" fill="none" stroke="#f08a59" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="832" y="106" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMPOSITOR</text>
        <text x="922" y="264" fill="#f08a59" fill-opacity="0.06" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">05</text>
        <text x="798" y="132" fill="#f8fafc" font-size="12" font-weight="600" font-family="'Geist', sans-serif">EEVEE-Next Post</text>
        <text x="798" y="148" fill="#94a3b8" font-size="8.5" font-family="'Geist Mono', monospace">Viewport Shaders</text>
        <line x1="798" y1="160" x2="922" y2="160" stroke="#f8fafc" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="798" y="178" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• 8-Sector Kuwahara</text>
        <text x="798" y="196" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• Edge-preserving filter</text>
        <text x="798" y="214" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• Sobel ink contours</text>
        <text x="798" y="232" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• Cold-press paper grain</text>
        <text x="798" y="250" fill="#f08a59" font-size="7.5" font-family="'Geist Mono', monospace">Real-time compositing</text>
      </g>

      <!-- Node 6: Master Output -->
      <g>
        <rect x="956" y="84" width="132" height="196" rx="6" fill="#151d30"/>
        <rect x="956" y="84" width="132" height="196" rx="6" fill="#00e5ff" fill-opacity="0.04" stroke="#00e5ff" stroke-width="1"/>
        <rect x="966" y="96" width="46" height="14" rx="2" fill="none" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="989" y="106" fill="#00e5ff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUTPUT</text>
        <text x="1078" y="264" fill="#00e5ff" fill-opacity="0.08" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">06</text>
        <text x="966" y="132" fill="#f8fafc" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Painterly View</text>
        <text x="966" y="148" fill="#00e5ff" font-size="8.5" font-family="'Geist Mono', monospace">EEVEE-Next 60 FPS</text>
        <line x1="966" y1="160" x2="1078" y2="160" stroke="#f8fafc" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="966" y="178" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• Interactive 60 FPS</text>
        <text x="966" y="196" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• Watercolor / Impasto</text>
        <text x="966" y="214" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• N-Panel 1-click UI</text>
        <text x="966" y="232" fill="#cbd5e1" font-size="8" font-family="'Geist', sans-serif">• Offline 4K render</text>
        <text x="966" y="250" fill="#00e5ff" font-size="7.5" font-family="'Geist Mono', monospace">Stylized radiance field</text>
      </g>

      <!-- ========================================== -->
      <!-- LEGEND STRIP                               -->
      <!-- ========================================== -->
      <line x1="36" y1="324" x2="1104" y2="324" stroke="#f8fafc" stroke-opacity="0.12" stroke-width="0.8"/>
      <text x="36" y="344" fill="#94a3b8" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <!-- Legend item: Focal Core (Coral) -->
      <rect x="110" y="336" width="14" height="10" rx="2" fill="#f08a59" fill-opacity="0.10" stroke="#f08a59" stroke-width="1"/>
      <text x="130" y="344" fill="#cbd5e1" font-size="8.5" font-family="'Geist', sans-serif">Focal Modifier (Geometry Nodes)</text>

      <!-- Legend item: Native GPU Buffer (Cyan) -->
      <rect x="360" y="336" width="14" height="10" rx="2" fill="#00e5ff" fill-opacity="0.06" stroke="#00e5ff" stroke-width="1"/>
      <text x="380" y="344" fill="#cbd5e1" font-size="8.5" font-family="'Geist', sans-serif">OpenUSD / VRAM Native Buffer</text>

      <!-- Legend item: Toolchain Stage (Slate) -->
      <rect x="600" y="336" width="14" height="10" rx="2" fill="#151d30" stroke="#f8fafc" stroke-opacity="0.25" stroke-width="1"/>
      <text x="620" y="344" fill="#cbd5e1" font-size="8.5" font-family="'Geist', sans-serif">Ingestion / Capture</text>

      <!-- Legend item: Primary Flow Arrow -->
      <line x1="770" y1="341" x2="798" y2="341" stroke="#f08a59" stroke-width="1.4" marker-end="url(#pipeline_architecture_diagram-arch-arrow-accent)"/>
      <text x="806" y="344" fill="#cbd5e1" font-size="8.5" font-family="'Geist', sans-serif">Geometry / Shader Flow</text>

      <!-- Legend item: USD Bus Arrow -->
      <line x1="970" y1="341" x2="998" y2="341" stroke="#00e5ff" stroke-width="1.4" marker-end="url(#pipeline_architecture_diagram-arch-arrow-cyan)"/>
      <text x="1006" y="344" fill="#cbd5e1" font-size="8.5" font-family="'Geist', sans-serif">Zero-Copy GPU Stream</text>
    </svg>
